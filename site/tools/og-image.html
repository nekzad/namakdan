<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Namakdan social image</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #1e1b2e;
      }

      img {
        display: block;
        width: 680px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="../assets/namakdan-logo-dark.svg" width="800" height="260" alt="Namakdan">
  </body>
</html>
